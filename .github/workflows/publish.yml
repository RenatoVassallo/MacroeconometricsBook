name: Publicar el libro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Crear el entorno
        run: uv sync --frozen

      # Una sola llamada para los dos formatos: `quarto render --to <formato>`
      # limpia el directorio de salida, de modo que renderizar por separado
      # borraria el resultado anterior.
      - name: Renderizar (HTML y PDF)
        id: render
        continue-on-error: true
        run: uv run quarto render

      # Red de seguridad: si LaTeX falla, se publica al menos la version web
      # en lugar de dejar el sitio sin actualizar. El paso anterior queda
      # marcado como fallido, asi que el problema sigue siendo visible.
      - name: Si el PDF fallo, publicar solo la web
        if: steps.render.outcome == 'failure'
        run: uv run quarto render --to html

      - name: Comprobar el resultado
        run: |
          test -f _book/index.html
          ls _book/*.pdf \
            || echo "::warning::El PDF no se genero; se publica solo la web."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
